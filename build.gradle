plugins {
    id 'java'
    id "xyz.wagyourtail.unimined" version "1.4.2-SNAPSHOT"
}

group = project_group
version = mod_version

base {
    archivesName = mod_id
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

sourceSets {
    fabric
    neoforge
}

configurations {
    mainImplementation
    fabricModCompileOnly
}

configurations.fabricCompileOnly.extendsFrom(configurations.fabricModCompileOnly)

repositories {
    unimined.neoForgedMaven()
    unimined.spongeMaven
    unimined.wagYourMaven("releases")
    unimined.modrinthMaven()

    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }

    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup("software.bernie.geckolib")
        }
    }
}

unimined.minecraft {
    version minecraft_version

    mappings {
        mojmap()
    }

    defaultRemapJar = false
}

unimined.minecraft(sourceSets.fabric) {
    combineWith(sourceSets.main)

    fabric {
        loader project.fabric_loader
    }
    mods {
        remap(configurations.fabricModCompileOnly)
    }

    defaultRemapJar = true
}

unimined.minecraft(sourceSets.neoforge) {
    combineWith(sourceSets.main)

    neoForge {
        loader project.neoforge_version
    }

    minecraftRemapper.config {
        ignoreConflicts(true)
    }

    defaultRemapJar = true
}

dependencies {
    neoforgeModImplementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    fabricModImplementation "software.bernie.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"
    fabricModImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api}"
    fabricModCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    fabricModCompileOnly "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}"

    // Just to resolve it in common
    modImplementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    compileOnly "fuzs.forgeconfigapiport:forgeconfigapiport-common-neoforgeapi:${forgeconfigapiport_version}"
}

// Move the geckolib contents into the mod assets
processResources {
    exclude("models") // BlockBench project dir
    exclude("assets/${mod_id}/items") // 26.1 items
    exclude("assets/${mod_id}/geckolib") // Old geckolib folder

    ['geo', 'textures', 'animations'].each { folder ->
        from("src/main/resources/assets/minecraftbluearchivehalo/geckolib/${folder}") {
            into("assets/minecraftbluearchivehalo/${folder}")
        }
    }
}

processFabricResources {
    def buildProps = project.properties.clone()

    filesMatching("fabric.mod.json") {
        expand buildProps
    }
}

processNeoforgeResources {
    def buildProps = project.properties.clone()

    filesMatching("META-INF/neoforge.mods.toml") {
        expand buildProps
    }
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}
compileTestJava.enabled = false